# Extends very_good_analysis — a strict, opinionated lint ruleset maintained
# by Very Good Ventures. All rules in that package are active by default.
# Overrides below are project-specific and documented with a reason.
include: package:very_good_analysis/analysis_options.yaml

# Analyzer plugins are declared top-level, not nested under `analyzer:`.
# riverpod_lint now runs on Dart's native analysis_server_plugin, so it
# needs no custom_lint dependency and no pubspec.yaml entry — the analyzer
# fetches it directly from this pin. Bump the version by checking
# https://pub.dev/packages/riverpod_lint for the latest release.
# This closes a gap the general-purpose Dart analyzer can't see on its own:
# Riverpod-specific correctness (e.g. ref used inside State.dispose(),
# BuildContext leaking into a provider, missing @Riverpod dependencies).
plugins:
  riverpod_lint: 3.1.3

analyzer:
  errors:
    comment_references: ignore
  # Enable strict mode to maximize the type system's safety guarantees.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  # Point the analyzer to the relevant folders; exclude generated code.
  exclude:
    # Files generated by build_runner don't need to be analyzed.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    # Assets and fonts don't contain Dart code.
    - "assets/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # ── Rules disabled with an explicit reason ─────────────────────────────

    # very_good_analysis requires `public_member_api_docs` on every member.
    # For this starter template, forcing doc comments on trivial getters/
    # setters hurts readability more than it helps. Doc comments are still
    # required on non-trivial public classes and methods.
    public_member_api_docs: false

    # Require a trailing comma on every multi-line argument list.
    # Enabled — consistent with shadcn/ui formatting style.
    require_trailing_commas: true

    # `lines_longer_than_80_chars` is disabled because the 80-character
    # limit is too strict for files that lean on long named parameters
    # (e.g. ThemeData, ButtonStyle). Use dart format with the default
    # line length (80) at commit time.
    lines_longer_than_80_chars: false

    # `prefer_double_quotes` is disabled — this project uses single quotes
    # consistently, per Flutter community convention.
    prefer_double_quotes: false

    # `sort_pub_dependencies` is disabled — it's a cosmetic-only rule, and
    # this template's pubspec.yaml is already kept alphabetical by
    # convention, so enforcing it via lint adds no value beyond what's
    # already followed manually.
    sort_pub_dependencies: false

    # ── Additional rules enabled ────────────────────────────────────────────

    # Ensure every switch is exhaustive — critical for sealed classes
    # (Failure, ScreenSizeClass, ThemeMode) so the compiler catches new
    # cases the moment they're added.
    # (Already enabled by very_good_analysis; listed here as documentation.)
    exhaustive_cases: true

    # Forbid direct `print()` calls — use Talker instead.
    avoid_print: true

    # Force const constructors wherever possible, for runtime performance.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # Forbid unnecessary use of dynamic.
    avoid_dynamic_calls: true

    # very_good_analysis excludes this rule by default (unresolved false
    # positives — dart-lang/linter#1381). Enabled here anyway: a Sink or
    # StreamController that's never closed is a classic silent memory leak,
    # and this is the only compile-time signal for it. Expect an occasional
    # `// ignore: close_sinks` where the lifecycle is intentionally managed
    # elsewhere (e.g. via ref.onDispose).
    close_sinks: true
    